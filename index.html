<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>장학 PUNCH LIST</title>
    <!-- PWA -->
    <link rel="manifest" href="/quality-inspection/manifest.json">
    <meta name="theme-color" content="#c0392b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="장학 PUNCH LIST">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f1923;
            --surface: #162030;
            --surface2: #1e2d3d;
            --surface3: #253545;
            --border: rgba(255,255,255,0.08);
            --border-bright: rgba(255,255,255,0.18);
            --accent: #1a8cff;
            --accent-glow: rgba(26,140,255,0.25);
            --danger: #ff4545;
            --danger-glow: rgba(255,69,69,0.2);
            --success: #00d68f;
            --success-glow: rgba(0,214,143,0.2);
            --warning: #ffaa00;
            --text-primary: #f0f4f8;       /* ↑ 더 밝고 선명하게 */
            --text-secondary: #a8bece;     /* ↑ #7a92a8 → 훨씬 밝게 */
            --text-muted: #6e8898;         /* ↑ #4a6070 → 밝게 */
            --fs-header: 22px;
            --fs-title: 20px;
            --fs-body: 19px;               /* ↑ 16→17px */
            --fs-sub: 17px;                /* ↑ 14→15px */
            --fs-small: 15px;              /* ↑ 12→13px */
        }
        * { box-sizing: border-box; }
        body {
            font-family: "IBM Plex Sans KR", -apple-system, sans-serif;
            margin: 0; background: var(--primary);
            height: 100vh; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column;
            font-size: var(--fs-body); color: var(--text-primary);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            height: calc(52px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 16px; padding-right: 16px;
            font-weight: 600; font-size: var(--fs-header);
            z-index: 1000; flex-shrink: 0;
            box-shadow: 0 1px 0 var(--border), 0 4px 24px rgba(0,0,0,0.4);
        }
        main { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar Left */
        #sidebar-left { width: 248px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        #sidebar-left::-webkit-scrollbar { width: 4px; }
        #sidebar-left::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        /* Tree */
        .tree-children { display: none; padding-left: 0; border-left: none; margin-left: 0; }
        .tree-children.active { display: block; }
        .tree-node { cursor: pointer; padding: 9px 10px 9px 12px; font-size: var(--fs-sub); display: flex; align-items: center; gap: 6px; color: var(--text-primary); font-weight: 500; transition: background 0.12s, color 0.12s; }
        .tree-node:hover { background: var(--surface2); color: var(--text-primary); }
        .tree-item { padding: 7px 10px 7px 12px; cursor: pointer; font-size: var(--fs-sub); border-radius: 6px; margin: 2px 6px; color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background 0.12s, color 0.12s; }
        .tree-item:hover { background: var(--surface2); color: var(--text-primary); }
        .tree-item.selected { background: linear-gradient(90deg, rgba(26,140,255,0.22), rgba(26,140,255,0.08)); color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; margin-left: 0; padding-left: 16px; }
        .tree-item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .depth-floor { padding-left: 26px; }
        .depth-room { padding-left: 42px; }
        .tree-node.long-active, .tree-item.long-active { background: rgba(26,140,255,0.1); border-radius: 6px; }
        .tree-node.drag-over { border-top: 2px solid var(--accent); }
        .tree-node.dragging-node { opacity: 0.35; }
        .tree-node-inner { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .tree-drag-handle { cursor: grab; color: var(--text-muted); font-size: 14px; padding: 0 3px; flex-shrink: 0; user-select: none; touch-action: none; }
        .tree-drag-handle:active { cursor: grabbing; }
        .tree-badges { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; padding-left: 6px; }
        .tree-badge { min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; padding: 0 5px; box-sizing: border-box; line-height: 1; font-family: "JetBrains Mono", monospace; }
        .tree-badge.red  { background: var(--danger); box-shadow: 0 1px 6px var(--danger-glow); }
        .tree-badge.blue { background: var(--accent); box-shadow: 0 1px 6px var(--accent-glow); }
        .tree-badge.zero { display: none; }

        /* Canvas center */
        #content-center { flex: 1; overflow: hidden; background: radial-gradient(ellipse at center, #1a2535 0%, #0f1923 70%); position: relative; touch-action: none; }
        #content-center::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
        #zoom-viewport { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; z-index: 1; }
        #canvas-container { position: absolute; display: none; box-shadow: 0 8px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transform-origin: 0 0; cursor: grab; border-radius: 2px; }
        #canvas-container.panning { cursor: grabbing; }
        #blueprint-display { display: block; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; pointer-events: none; }
        #pin-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Zoom controls */
        #zoom-controls { position: absolute; bottom: 20px; right: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 200; }
        .zoom-btn { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border-bright); background: rgba(22,32,48,0.9); backdrop-filter: blur(8px); box-shadow: 0 2px 12px rgba(0,0,0,0.4); font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-primary); transition: background 0.15s, color 0.15s; }
        .zoom-btn:hover { background: var(--surface3); color: var(--text-primary); }
        .zoom-btn:active { background: var(--accent); color: #fff; }
        #zoom-level-badge { display: none; position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 700; background: rgba(15,25,35,0.7); backdrop-filter: blur(6px); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border-bright); pointer-events: none; font-family: "JetBrains Mono", monospace; }

        /* Pins */
        .pin { pointer-events: all; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .pin { position: absolute; width: 32px; height: 32px; border: 2.5px solid rgba(255,255,255,0.9); border-radius: 50%; color: white; text-align: center; font-size: 14px; font-weight: 700; line-height: 27px; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; font-family: "JetBrains Mono", monospace; transition: transform 0.15s; }
        .pin:hover { transform: translate(-50%, -50%) scale(1.2); }
        .pin-red { background: var(--danger); box-shadow: 0 3px 12px var(--danger-glow), 0 0 0 3px rgba(255,69,69,0.2); }
        .pin-blue { background: var(--accent); box-shadow: 0 3px 12px var(--accent-glow), 0 0 0 3px rgba(26,140,255,0.2); }

        /* Sidebar Right */
        #sidebar-right { width: 248px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        #sidebar-right::-webkit-scrollbar { width: 4px; }
        #sidebar-right::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
        .summary-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: var(--fs-sub); color: var(--text-primary); transition: background 0.12s; }
        .summary-item:hover { background: var(--surface2); color: var(--text-primary); }

        /* Modal overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1100; }

        /* Modal sheet */
        .modal { display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border-bright); width: 100%; max-width: 1000px; border-radius: 20px 20px 0 0; z-index: 1200; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1); overflow: hidden; box-shadow: 0 -8px 60px rgba(0,0,0,0.5); }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(100%); } to { transform: translateX(-50%) translateY(0); } }
        .report-modal { height: 92vh; }
        .modal-body { display: flex; flex-direction: column; height: 100%; }

        /* 2단 비교 */
        .comparison-container { display: flex; flex: 1; overflow: hidden; border-top: 1px solid var(--border); }
        .comparison-column { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .comparison-column:last-child { border-right: none; }
        .column-header { padding: 14px 16px; background: var(--primary); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .column-title { font-size: var(--fs-body); font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .column-info { font-size: calc(var(--fs-sub) + 1px); color: #ffffff; min-height: 36px; line-height: 1.6; white-space: pre-wrap; font-weight: 500; }
        .photo-scroll-area { flex: 1; overflow-y: auto; padding: 12px; background: var(--primary); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
        .photo-scroll-area::-webkit-scrollbar { width: 4px; }
        .photo-scroll-area::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
        .photo-list { display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
        .photo-list img { width: 100%; border-radius: 8px; border: 1px solid var(--border-bright); object-fit: cover; cursor: pointer; touch-action: pan-y; transition: border-color 0.15s; }
        .photo-list img:hover { border-color: var(--accent); }

        /* Lightbox */
        #lightbox { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
        #lightbox.open { display: flex; }
        #lightbox-img { max-width: 95vw; max-height: 90vh; border-radius: 6px; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; cursor: grab; }
        #lightbox-img.panning { cursor: grabbing; }
        #lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 34px; color: rgba(255,255,255,0.7); cursor: pointer; line-height: 1; background: none; border: none; z-index: 100000; transition: color 0.15s; }
        #lightbox-close:hover { color: #fff; }
        #lightbox-scale-badge { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); font-size: 12px; font-weight: 700; background: rgba(0,0,0,0.5); padding: 3px 12px; border-radius: 20px; pointer-events: none; display: none; font-family: "JetBrains Mono", monospace; }
        #lightbox-zoom-btns { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
        #lightbox-zoom-btns button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border-bright); background: rgba(255,255,255,0.12); color: #fff; font-size: 22px; cursor: pointer; font-weight: bold; transition: background 0.15s; }
        #lightbox-zoom-btns button:hover { background: rgba(255,255,255,0.22); }

        /* ✏️ 마킹 툴바 */
        #marking-toolbar {
            display: none; position: fixed; top: 16px; left: 50%;
            transform: translateX(-50%); z-index: 100002;
            background: rgba(20,20,20,0.88); border-radius: 40px;
            padding: 8px 18px; gap: 10px; align-items: center;
            flex-wrap: wrap; justify-content: center;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
        }
        #marking-toolbar.show { display: flex; }
        #marking-toolbar button {
            border: none; border-radius: 50%; cursor: pointer;
            width: 40px; height: 40px; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.12); color: #fff; transition: background 0.15s;
        }
        #marking-toolbar button:hover { background: rgba(255,255,255,0.25); }
        #marking-toolbar button.active-tool { background: rgba(255,255,255,0.45); }
        #marking-toolbar .mark-sep { width: 1px; height: 28px; background: rgba(255,255,255,0.2); }
        .mark-color-btn {
            width: 28px !important; height: 28px !important;
            border-radius: 50% !important; border: 3px solid rgba(255,255,255,0.3) !important;
            cursor: pointer; flex-shrink: 0; transition: transform 0.15s;
        }
        .mark-color-btn.selected { border-color: #fff !important; transform: scale(1.25); }
        #mark-canvas {
            position: fixed; display: none;
            cursor: crosshair; touch-action: none; z-index: 100001;
        }
        #mark-canvas.show { display: block; }

        /* 업로드 직후 마킹 모달 */
        #upload-mark-modal {
            display: none; position: fixed; inset: 0; z-index: 99998;
            background: rgba(0,0,0,0.97); flex-direction: column;
            align-items: center; justify-content: center;
        }
        #upload-mark-modal.open { display: flex; }
        #upload-mark-canvas {
            max-width: 95vw; max-height: 72vh;
            border-radius: 8px; touch-action: none; cursor: crosshair;
        }
        #upload-mark-toolbar {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            justify-content: center; margin-top: 14px;
            background: rgba(30,30,30,0.9); border-radius: 40px;
            padding: 10px 20px; border: 1px solid rgba(255,255,255,0.15);
        }
        #upload-mark-toolbar button {
            border: none; border-radius: 50%; cursor: pointer;
            width: 42px; height: 42px; font-size: 18px;
            background: rgba(255,255,255,0.12); color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        #upload-mark-toolbar button.active-tool { background: rgba(255,255,255,0.4); }
        #upload-mark-toolbar .um-sep { width:1px; height:28px; background:rgba(255,255,255,0.2); }
        .um-color-btn {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3); cursor: pointer; flex-shrink: 0;
        }
        .um-color-btn.selected { border-color: #fff; transform: scale(1.25); }
        #upload-mark-actions {
            display: flex; gap: 12px; margin-top: 16px;
        }
        #upload-mark-actions button {
            padding: 12px 28px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer;
        }

        /* Edit mode */
        #edit-mode { padding: 20px; overflow-y: auto; flex: 1; touch-action: pan-y; -webkit-overflow-scrolling: touch; background: var(--surface); }
        #edit-mode::-webkit-scrollbar { width: 4px; }
        #edit-mode::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
        .process-chip { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border-bright); font-size: var(--fs-sub); cursor: pointer; background: var(--surface2); color: var(--text-secondary); margin-right: 6px; margin-bottom: 6px; font-family: "IBM Plex Sans KR", sans-serif; transition: background 0.12s, color 0.12s, border-color 0.12s; }
        .process-chip:hover { background: var(--surface3); color: var(--text-primary); }
        .process-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }
        textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid var(--border-bright); border-radius: 10px; margin: 8px 0; font-size: var(--fs-body); background: var(--primary); color: var(--text-primary); font-family: "IBM Plex Sans KR", sans-serif; resize: none; transition: border-color 0.15s; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .thumb-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .thumb-wrapper { position: relative; width: 76px; height: 76px; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-bright); }
        .thumb-del-btn { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; background: var(--danger); color: white; border-radius: 50%; text-align: center; font-size: 13px; border: 2px solid var(--surface); line-height: 17px; cursor: pointer; }

        /* Context menu */
        #tree-context-menu { display: none; position: fixed; z-index: 9999; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); overflow: hidden; min-width: 200px; animation: menuPop 0.15s ease; }
        @keyframes menuPop { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #tree-context-menu .menu-title { padding: 11px 16px 8px; font-size: var(--fs-small); color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
        #tree-context-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: none; background: none; font-size: var(--fs-sub); cursor: pointer; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-primary); font-weight: 500; transition: background 0.12s, color 0.12s; font-family: "IBM Plex Sans KR", sans-serif; }
        #tree-context-menu button:last-child { border-bottom: none; }
        #tree-context-menu button:hover { background: var(--surface3); color: var(--text-primary); }
        #tree-context-menu button.danger { color: var(--danger); }
        #tree-context-menu button.danger:hover { background: rgba(255,69,69,0.12); }

        /* PWA */
        #pwa-install-overlay { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); justify-content: center; align-items: center; flex-direction: column; gap: 0; }
        #pwa-install-overlay.show { display: flex; }
        #pwa-install-card { background: var(--surface); border: 1px solid var(--border-bright); border-radius: 24px; padding: 40px 44px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.6); max-width: 360px; width: 90%; animation: pwaFadeIn 0.3s ease; }
        @keyframes pwaFadeIn { from { opacity:0; transform: scale(0.88) translateY(20px); } to { opacity:1; transform: scale(1) translateY(0); } }
        #pwa-install-card img { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        #pwa-install-card h2 { margin: 0 0 8px; font-size: 21px; color: var(--text-primary); font-weight: 800; }
        #pwa-install-card p  { margin: 0 0 28px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
        #pwa-btn-install { width: 100%; padding: 15px; background: linear-gradient(135deg, #c0392b, #e74c3c); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 20px rgba(192,57,43,0.4); margin-bottom: 12px; transition: transform 0.1s; font-family: "IBM Plex Sans KR", sans-serif; }
        #pwa-btn-install:active { transform: scale(0.97); }
        #pwa-btn-skip { width: 100%; padding: 12px; background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; font-family: "IBM Plex Sans KR", sans-serif; }
    </style>
</head>
<body>
    <!-- PWA 설치 오버레이 -->
    <div id="pwa-install-overlay">
        <div id="pwa-install-card">
            <img src="/icons/icon-192x192.png" alt="앱 아이콘">
            <h2>현장품질검수 Pro</h2>
            <p>홈 화면에 설치하면<br>앱처럼 빠르게 실행할 수 있습니다.</p>
            <button id="pwa-btn-install" onclick="pwaBtnInstall()">⬇️ 지금 설치하기</button>
            <button id="pwa-btn-skip" onclick="pwaDismiss()">나중에 설치</button>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:10px; height:100%; min-width:0;">

                    <button onclick="triggerUpload('after', 'camera')" style="width:100px; height:50px; flex-shrink:0; font-size:var(--fs-sub); font-weight:600; border:1px solid var(--border-bright); border-radius:8px; background:var(--surface2); color:var(--text-secondary); cursor:pointer; font-family:'IBM Plex Sans KR',sans-serif; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5px;">📷 촬영</button>
                    <button onclick="triggerUpload('after', 'gallery')" style="width:100px; height:50px; flex-shrink:0; font-size:var(--fs-sub); font-weight:600; border:1px solid var(--border-bright); border-radius:8px; background:var(--surface2); color:var(--text-secondary); cursor:pointer; font-family:'IBM Plex Sans KR',sans-serif; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5px;">🖼️ 갤러리</button>
                    <div id="thumbs-after" class="thumb-container" style="flex:1; margin-bottom:0;"></div>
                </div>
                <button onclick="saveData()" style="width:100%; padding:16px; background:var(--accent); color:white; border:none; border-radius:12px; font-size:var(--fs-sub); font-weight:700; margin-top:20px; cursor:pointer; font-family:'IBM Plex Sans KR',sans-serif; box-shadow:0 4px 20px var(--accent-glow);">💾 저장 완료</button>
            </div>
        </div>
        <input type="file" id="input-camera" style="display:none" accept="image/*" capture="camera" onchange="handlePhotoUpload(event)">
        <input type="file" id="input-gallery" style="display:none" accept="image/*" multiple onchange="handlePhotoUpload(event)">
    </div>

    <script>
        let db;
        const request = indexedDB.open("InspectionDB", 2);
        request.onupgradeneeded = e => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains("blueprints")) {
                d.createObjectStore("blueprints", { autoIncrement: true });
            }
        };
        request.onsuccess = e => {
            db = e.target.result;
            // 스토어가 실제로 존재하는지 한 번 더 확인
            if (!db.objectStoreNames.contains("blueprints")) {
                db.close();
                // 버전을 하나 더 올려서 스토어 강제 생성
                const fix = indexedDB.open("InspectionDB", db.version + 1);
                fix.onupgradeneeded = ev => {
                    ev.target.result.createObjectStore("blueprints", { autoIncrement: true });
                };
                fix.onsuccess = ev => { db = ev.target.result; document.getElementById('db-status').innerText = ""; loadAllData(); };
                fix.onerror   = ev => { document.getElementById('db-status').innerText = "⚠️ 저장오류"; console.error(ev.target.error); };
            } else {
                document.getElementById('db-status').innerText = "";
                loadAllData();
            }
        };
        request.onerror = e => { document.getElementById('db-status').innerText = "⚠️ 저장오류"; console.error("IndexedDB 오류:", e.target.error); };

        let blueprints = []; let activeIdx = -1; let currentPinId = null; let uploadTarget = 'before';
        let movingPinId = null; // 이동 중인 핀 ID
        let isDraggingPin = false; // 드래그 중 도면 클릭 차단용
        // 공정 목록 — localStorage에서 불러오기 (없으면 기본값)
        function getProcesses() {
            try { const s = localStorage.getItem('processes'); return s ? JSON.parse(s) : ["도배","타일","전기","목공","도장","가구","바닥재","기타"]; } catch(e) { return ["도배","타일","전기","목공","도장","가구","바닥재","기타"]; }
        }
        function saveProcesses(arr) { localStorage.setItem('processes', JSON.stringify(arr)); }

        function getToday() { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; }
        // 날짜 서식 통일: 2026.5.7 또는 2026.05.07 → 2026-05-07
        function normalizeDate(d) {
            if (!d) return '';
            const parts = d.replace(/\./g, '-').split('-');
            if (parts.length !== 3) return d;
            return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
        }


        // ── 현장명 인라인 편집 ──
        function startEditSiteName() {
            const disp  = document.getElementById('site-name-display');
            const input = document.getElementById('site-name-input');
            input.value = localStorage.getItem('siteName') || '';
            disp.style.display  = 'none';
            input.style.display = 'inline-block';
            input.focus();
        }
        function finishEditSiteName() {
            const disp  = document.getElementById('site-name-display');
            const input = document.getElementById('site-name-input');
            const val   = input.value.trim();
            localStorage.setItem('siteName', val);
            disp.innerText      = val || '✏️ 현장명';
            disp.style.display  = 'inline';
            input.style.display = 'none';
        }
        // 앱 시작 시 저장된 현장명 복원
        (function() {
            const saved = localStorage.getItem('siteName');
            if (saved) document.getElementById('site-name-display').innerText = saved;
        })();
        function loadAllData() {
            const transaction = db.transaction(["blueprints"], "readonly");
            transaction.objectStore("blueprints").getAll().onsuccess = e => { blueprints = e.target.result; renderTree(); };
        }

        let _saveTimer = null;
        async function syncDB() {
            return new Promise((resolve, reject) => {
                if (!db) { reject(new Error('DB가 초기화되지 않았습니다. 페이지를 새로고침해 주세요.')); return; }
                const transaction = db.transaction(["blueprints"], "readwrite");
                const store = transaction.objectStore("blueprints");

                transaction.oncomplete = () => {
                    const el = document.getElementById('db-status');
                    el.innerText = "💾 저장됨";
                    clearTimeout(_saveTimer);
                    _saveTimer = setTimeout(() => { el.innerText = ""; }, 2000);
                    resolve();
                };
                transaction.onerror = e => {
                    const msg = e.target.error ? e.target.error.message : '알 수 없는 오류';
                    document.getElementById('db-status').innerText = "⚠️ 저장오류";
                    reject(new Error('DB 트랜잭션 오류: ' + msg));
                };
                transaction.onabort = e => {
                    const err = transaction.error;
                    const msg = err ? err.message : '트랜잭션 중단';
                    document.getElementById('db-status').innerText = "⚠️ 저장오류";
                    // QuotaExceededError 감지
                    if (err && err.name === 'QuotaExceededError') {
                        alert('저장 공간이 부족합니다.\n사진 수를 줄이거나 데이터를 정리해 주세요.');
                    }
                    reject(new Error('DB 중단: ' + msg));
                };

                const clearReq = store.clear();
                clearReq.onsuccess = () => {
                    blueprints.forEach(bp => store.add(bp));
                };
                clearReq.onerror = e => reject(new Error('DB clear 오류: ' + e.target.error));
            });
        }

        // 핀 카운트 집계 헬퍼
        function countPins(bpList) {
            let red = 0, blue = 0;
            bpList.forEach(bp => {
                bp.pins.forEach(pin => {
                    if ((pin.afterPhotos && pin.afterPhotos.length > 0) || pin.afterNote) blue++;
                    else red++;
                });
            });
            return { red, blue };
        }

        function makeBadges(red, blue) {
            const wrap = document.createElement('div');
            wrap.className = 'tree-badges';
            const r = document.createElement('span');
            r.className = `tree-badge red${red === 0 ? ' zero' : ''}`;
            r.textContent = red;
            const b = document.createElement('span');
            b.className = `tree-badge blue${blue === 0 ? ' zero' : ''}`;
            b.textContent = blue;
            wrap.appendChild(r);
            wrap.appendChild(b);
            return wrap;
        }

        // ── 트리 순서 저장/로드 (동, 층) ──
        function getTreeOrder(key) {
            try { return JSON.parse(localStorage.getItem('treeOrder_' + key) || '[]'); } catch(e) { return []; }
        }
        function setTreeOrder(key, arr) {
            localStorage.setItem('treeOrder_' + key, JSON.stringify(arr));
        }
        function sortByOrder(items, savedOrder) {
            const ordered = [];
            savedOrder.forEach(k => { if (items.includes(k)) ordered.push(k); });
            items.forEach(k => { if (!ordered.includes(k)) ordered.push(k); });
            return ordered;
        }
        // 가나다/알파벳/숫자 자연 정렬
        function naturalSort(arr) {
            return [...arr].sort((a, b) =>
                a.localeCompare(b, ['ko', 'en'], { numeric: true, sensitivity: 'base' })
            );
        }

        function renderTree() {
            const container = document.getElementById('tree-container');

            // ── 현재 열린 동/층 상태 저장 ──
            const openDongs  = new Set();
            const openFloors = new Set(); // "dong::floor" 키
            container.querySelectorAll('.tree-children[data-level="dong"].active').forEach(el => {
                openDongs.add(el.getAttribute('data-dong'));
            });
            container.querySelectorAll('.tree-children[data-level="floor"].active').forEach(el => {
                openFloors.add(el.getAttribute('data-floor-key'));
            });

            container.innerHTML = "";
            const treeData = {};
            blueprints.forEach((bp, index) => {
                if (!treeData[bp.dong]) treeData[bp.dong] = {};
                if (!treeData[bp.dong][bp.floor]) treeData[bp.dong][bp.floor] = [];
                treeData[bp.dong][bp.floor].push({ ...bp, originalIndex: index });
            });

            // 동 순서: 저장된 순서 우선, 없으면 기존 순서
            const dongKeys = sortByOrder(Object.keys(treeData), getTreeOrder('dong'));

            let isFirstDong = true;
            dongKeys.forEach(dong => {
                const allDongBps = Object.values(treeData[dong]).flat();
                const dongCount = countPins(allDongBps.map(r => blueprints[r.originalIndex]));

                const dongNode = document.createElement('div');
                dongNode.setAttribute('data-dong-node', dong);

                const dongLabel = document.createElement('div');
                dongLabel.className = 'tree-node';
                dongLabel.setAttribute('draggable', 'false'); // 핸들로만 드래그

                // 드래그 핸들
                const dongHandle = document.createElement('span');
                dongHandle.className = 'tree-drag-handle';
                dongHandle.textContent = '⠿';
                dongHandle.title = '드래그하여 순서 변경';
                dongLabel.appendChild(dongHandle);

                const dongText = document.createElement('span');
                dongText.style.flex = '1';
                dongText.textContent = `📁 ${dong}`;
                dongLabel.appendChild(dongText);
                dongLabel.appendChild(makeBadges(dongCount.red, dongCount.blue));

                dongLabel.addEventListener('click', (e) => {
                    if (e.target === dongHandle) return;
                    toggleTree(dongLabel, 'dong');
                });
                attachLongPress(dongLabel, () => ({ type: 'dong', dong }));

                // 동 드래그 이벤트
                attachTreeDrag(dongHandle, dongNode, 'dong', container, () => {
                    const order = [...container.querySelectorAll('[data-dong-node]')].map(n => n.getAttribute('data-dong-node'));
                    setTreeOrder('dong', order);
                });

                dongNode.appendChild(dongLabel);

                const dongChildren = document.createElement('div');
                const dongWasOpen = openDongs.size > 0 ? openDongs.has(dong) : isFirstDong;
                dongChildren.className = `tree-children${dongWasOpen ? ' active' : ''}`;
                dongChildren.setAttribute('data-level', 'dong');
                dongChildren.setAttribute('data-dong', dong);
                isFirstDong = false;

                // 층 순서: 저장된 순서 우선
                const floorKeys = sortByOrder(Object.keys(treeData[dong]), getTreeOrder('floor_' + dong));

                floorKeys.forEach(floor => {
                    const floorKey = `${dong}::${floor}`;
                    const floorBps = treeData[dong][floor].map(r => blueprints[r.originalIndex]);
                    const floorCount = countPins(floorBps);

                    const floorNode = document.createElement('div');
                    floorNode.setAttribute('data-floor-node', floorKey);

                    const floorLabel = document.createElement('div');
                    floorLabel.className = 'tree-node depth-floor';

                    // 드래그 핸들
                    const floorHandle = document.createElement('span');
                    floorHandle.className = 'tree-drag-handle';
                    floorHandle.textContent = '⠿';
                    floorHandle.title = '드래그하여 순서 변경';
                    floorLabel.appendChild(floorHandle);

                    const floorText = document.createElement('span');
                    floorText.style.flex = '1';
                    floorText.textContent = `📂 ${floor}`;
                    floorLabel.appendChild(floorText);
                    floorLabel.appendChild(makeBadges(floorCount.red, floorCount.blue));

                    floorLabel.addEventListener('click', (e) => {
                        if (e.target === floorHandle) return;
                        toggleTree(floorLabel, 'floor');
                    });
                    attachLongPress(floorLabel, () => ({ type: 'floor', dong, floor }));

                    // 층 드래그 이벤트
                    attachTreeDrag(floorHandle, floorNode, 'floor_' + dong, dongChildren, () => {
                        const order = [...dongChildren.querySelectorAll(':scope > [data-floor-node]')].map(n => n.getAttribute('data-floor-node').split('::')[1]);
                        setTreeOrder('floor_' + dong, order);
                    });

                    floorNode.appendChild(floorLabel);

                    const floorChildren = document.createElement('div');
                    const floorWasOpen = openFloors.has(floorKey);
                    floorChildren.className = `tree-children${floorWasOpen ? ' active' : ''}`;
                    floorChildren.setAttribute('data-level', 'floor');
                    floorChildren.setAttribute('data-floor-key', floorKey);

                    // 공간명: 가나다/알파벳/숫자 자연 정렬
                    const sortedRooms = naturalSort(treeData[dong][floor].map(r => r.room));
                    sortedRooms.forEach(roomName => {
                        const roomObj = treeData[dong][floor].find(r => r.room === roomName);
                        if (!roomObj) return;
                        const roomCount = countPins([blueprints[roomObj.originalIndex]]);

                        const roomNode = document.createElement('div');
                        roomNode.className = `tree-item depth-room doc-item-${roomObj.originalIndex} ${roomObj.originalIndex === activeIdx ? 'selected' : ''}`;

                        const roomLabel = document.createElement('span');
                        roomLabel.className = 'tree-item-label';
                        roomLabel.textContent = `📄 ${roomObj.room}`;
                        roomNode.appendChild(roomLabel);
                        roomNode.appendChild(makeBadges(roomCount.red, roomCount.blue));

                        roomNode.addEventListener('click', (e) => { e.stopPropagation(); selectMap(roomObj.originalIndex); });
                        attachLongPress(roomNode, () => ({ type: 'room', dong, floor, roomIndex: roomObj.originalIndex, label: roomObj.room }));
                        floorChildren.appendChild(roomNode);
                    });

                    floorNode.appendChild(floorChildren);
                    dongChildren.appendChild(floorNode);
                });

                dongNode.appendChild(dongChildren);
                container.appendChild(dongNode);
            });
        }

        // ── 트리 드래그 앤 드롭 (터치 + 마우스 공통) ──
        function attachTreeDrag(handle, dragNode, orderKey, parentEl, onDrop) {
            let dragging = false;
            let ghost = null;
            let startY = 0;

            function getPointerY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

            function onStart(e) {
                if (e.button && e.button !== 0) return;
                dragging = true;
                startY = getPointerY(e);
                dragNode.classList.add('dragging-node');

                ghost = dragNode.cloneNode(true);
                ghost.style.cssText = `position:fixed; left:${dragNode.getBoundingClientRect().left}px; top:${dragNode.getBoundingClientRect().top}px; width:${dragNode.offsetWidth}px; opacity:0.7; pointer-events:none; z-index:9999; background:#e8f0fe; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.2);`;
                document.body.appendChild(ghost);
                e.preventDefault();
            }

            function onMove(e) {
                if (!dragging) return;
                const y = getPointerY(e);
                ghost.style.top = (parseFloat(ghost.style.top) + y - startY) + 'px';
                startY = y;

                // 삽입 위치 계산
                const siblings = [...parentEl.children].filter(n => n !== dragNode && n.getAttribute(dragNode.hasAttribute('data-dong-node') ? 'data-dong-node' : 'data-floor-node') !== null);
                parentEl.querySelectorAll('.tree-node.drag-over').forEach(n => n.classList.remove('drag-over'));

                for (const sib of siblings) {
                    const rect = sib.getBoundingClientRect();
                    if (y < rect.top + rect.height / 2) {
                        sib.querySelector('.tree-node')?.classList.add('drag-over');
                        break;
                    }
                }
                e.preventDefault();
            }

            function onEnd(e) {
                if (!dragging) return;
                dragging = false;
                dragNode.classList.remove('dragging-node');
                if (ghost) { ghost.remove(); ghost = null; }

                const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                const attrKey = dragNode.hasAttribute('data-dong-node') ? 'data-dong-node' : 'data-floor-node';
                const siblings = [...parentEl.children].filter(n => n.getAttribute(attrKey) !== null);

                parentEl.querySelectorAll('.tree-node.drag-over').forEach(n => n.classList.remove('drag-over'));

                let inserted = false;
                for (const sib of siblings) {
                    if (sib === dragNode) continue;
                    const rect = sib.getBoundingClientRect();
                    if (y < rect.top + rect.height / 2) {
                        parentEl.insertBefore(dragNode, sib);
                        inserted = true;
                        break;
                    }
                }
                if (!inserted) parentEl.appendChild(dragNode);
                onDrop();
            }

            // 마우스
            handle.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            // 터치
            handle.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        function toggleTree(el, level) {
            const children = el.nextElementSibling;
            const isOpen = children.classList.contains('active');
            if (isOpen) {
                children.classList.remove('active');
                return;
            }
            // 같은 부모 안의 동일 레벨 형제 children 모두 닫기 (아코디언)
            const parentContainer = el.parentElement.parentElement;
            parentContainer.querySelectorAll(`:scope > div > .tree-children[data-level="${level}"]`)
                .forEach(c => c.classList.remove('active'));
            children.classList.add('active');
        }

        // ── 줌/패닝 상태 ──
        let zoomScale   = 1;   // 현재 배율 (fitScale 기준 배수)
        let fitScale    = 1;   // fit 상태의 CSS scale 값
        let baseW = 0, baseH = 0;  // fit 상태의 이미지 픽셀 크기
        let panX = 0, panY = 0;    // translate 오프셋(px)
        let isPanning   = false;
        let panStartX   = 0, panStartY = 0;
        let panOriginX  = 0, panOriginY = 0;

        const MIN_ZOOM = 1.0;   // fit 이하로는 축소 불가
        const MAX_ZOOM = 8.0;

        function applyTransform() {
            const container = document.getElementById('canvas-container');
            const s = fitScale * zoomScale;
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${s})`;
            // 핀은 항상 화면상 동일 크기 유지 — 줌 배율의 역수로 보정
            const inv = 1 / s;
            document.querySelectorAll('#pin-layer .pin').forEach(pin => {
                pin.style.transform = `translate(-50%, -50%) scale(${inv})`;
            });
        }

        function clampPan() {
            const center = document.getElementById('content-center');
            const cw = center.clientWidth, ch = center.clientHeight;
            const s = fitScale * zoomScale;
            const iw = baseW * s, ih = baseH * s;

            // 도면이 뷰포트보다 작으면 중앙 고정
            if (iw <= cw) { panX = (cw - iw) / 2; }
            else {
                const minX = cw - iw;
                panX = Math.min(0, Math.max(minX, panX));
            }
            if (ih <= ch) { panY = (ch - ih) / 2; }
            else {
                const minY = ch - ih;
                panY = Math.min(0, Math.max(minY, panY));
            }
        }

        // 도면 이미지를 가운데 영역에 꽉 차게 맞추는 함수
        function fitBlueprint() {
            const center = document.getElementById('content-center');
            const container = document.getElementById('canvas-container');
            const img = document.getElementById('blueprint-display');
            if (!img.naturalWidth || !img.naturalHeight) return;

            const pad = 20;
            const availW = center.clientWidth  - pad * 2;
            const availH = center.clientHeight - pad * 2;
            const ratio  = img.naturalWidth / img.naturalHeight;

            let w, h;
            if (availW / availH > ratio) {
                h = availH; w = Math.round(h * ratio);
            } else {
                w = availW; h = Math.round(w / ratio);
            }

            // 실제 이미지 크기 고정, transform으로만 스케일
            baseW = w; baseH = h;
            img.style.width  = w + 'px';
            img.style.height = h + 'px';
            container.style.width  = w + 'px';
            container.style.height = h + 'px';
            container.style.position = 'absolute';
            container.style.left = '0';
            container.style.top  = '0';
            container.style.transformOrigin = '0 0';

            // fit 배율 계산 (scale=1 일 때 뷰포트 꽉 참)
            fitScale = 1;
            zoomScale = 1;
            panX = (center.clientWidth  - w) / 2;
            panY = (center.clientHeight - h) / 2;
            applyTransform();
            showZoomBadge();
        }

        function resetZoom() {
            zoomScale = 1;
            const center = document.getElementById('content-center');
            panX = (center.clientWidth  - baseW) / 2;
            panY = (center.clientHeight - baseH) / 2;
            applyTransform();
            showZoomBadge();
        }

        function zoomStep(factor, cx, cy) {
            const center = document.getElementById('content-center');
            // 줌 기준점: 지정 없으면 뷰포트 중앙
            const pivotX = (cx !== undefined) ? cx : center.clientWidth  / 2;
            const pivotY = (cy !== undefined) ? cy : center.clientHeight / 2;

            const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoomScale * factor));
            const ratio   = newZoom / zoomScale;
            zoomScale = newZoom;

            // 줌 기준점 유지하며 pan 보정
            panX = pivotX - ratio * (pivotX - panX);
            panY = pivotY - ratio * (pivotY - panY);
            clampPan();
            applyTransform();
            showZoomBadge();
        }

        let zoomBadgeTimer = null;
        function showZoomBadge() {
            const badge = document.getElementById('zoom-level-badge');
            if (!badge) return;
            badge.textContent = Math.round(zoomScale * 100) + '%';
            badge.style.display = 'block';
            clearTimeout(zoomBadgeTimer);
            zoomBadgeTimer = setTimeout(() => { badge.style.display = 'none'; }, 1500);
        }

        // ── 마우스 휠 줌 ──
        document.getElementById('content-center').addEventListener('wheel', e => {
            if (activeIdx === -1) return;
            e.preventDefault();
            const center = document.getElementById('content-center');
            const rect = center.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
            zoomStep(factor, cx, cy);
        }, { passive: false });

        // ── 마우스 드래그 패닝 ──
        (function() {
            const center = document.getElementById('content-center');
            let dragging = false;
            let dragStartX = 0, dragStartY = 0;
            let panStartXd = 0, panStartYd = 0;
            let moved = false;

            center.addEventListener('mousedown', e => {
                if (e.button !== 0 || activeIdx === -1) return;
                // 핀 클릭은 패닝 시작 안 함
                if (e.target.classList.contains('pin')) return;
                dragging = true; moved = false;
                dragStartX = e.clientX; dragStartY = e.clientY;
                panStartXd = panX; panStartYd = panY;
                document.getElementById('canvas-container').classList.add('panning');
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
                if (!moved) return;
                panX = panStartXd + dx;
                panY = panStartYd + dy;
                clampPan();
                applyTransform();
            });
            document.addEventListener('mouseup', e => {
                if (!dragging) return;
                dragging = false;
                document.getElementById('canvas-container').classList.remove('panning');
                if (moved) {
                    // 드래그 후 click(handleCanvasClick) 차단
                    center._suppressClick = true;
                    setTimeout(() => { center._suppressClick = false; }, 50);
                }
            });
        })();

        // ── 터치 핀치 줌 + 패닝 ──
        (function() {
            const center = document.getElementById('content-center');
            let touches = [];
            let initDist = 0, initZoom = 1;
            let initPanX = 0, initPanY = 0;
            let initMidX = 0, initMidY = 0;
            let touchMoved = false;

            function dist(a, b) {
                return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            }
            function mid(a, b) {
                return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
            }

            center.addEventListener('touchstart', e => {
                if (activeIdx === -1) return;
                touches = Array.from(e.touches);
                touchMoved = false;
                if (touches.length === 2) {
                    e.preventDefault();
                    initDist = dist(touches[0], touches[1]);
                    initZoom = zoomScale;
                    initPanX = panX; initPanY = panY;
                    const m = mid(touches[0], touches[1]);
                    const rect = center.getBoundingClientRect();
                    initMidX = m.x - rect.left;
                    initMidY = m.y - rect.top;
                } else if (touches.length === 1) {
                    initPanX = panX; initPanY = panY;
                    initMidX = touches[0].clientX;
                    initMidY = touches[0].clientY;
                }
            }, { passive: false });

            center.addEventListener('touchmove', e => {
                if (activeIdx === -1) return;
                const t = Array.from(e.touches);
                touchMoved = true;
                if (t.length === 2 && touches.length === 2) {
                    e.preventDefault();
                    const rect = center.getBoundingClientRect();
                    const curDist = dist(t[0], t[1]);
                    const factor  = curDist / initDist;
                    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, initZoom * factor));
                    const ratio   = newZoom / initZoom;
                    zoomScale = newZoom;

                    const m = mid(t[0], t[1]);
                    const curMidX = m.x - rect.left;
                    const curMidY = m.y - rect.top;

                    panX = curMidX - ratio * (initMidX - initPanX);
                    panY = curMidY - ratio * (initMidY - initPanY);
                    clampPan();
                    applyTransform();
                    showZoomBadge();
                } else if (t.length === 1 && touches.length === 1 && zoomScale > 1) {
                    // 확대 상태에서 단일 터치 패닝
                    if (e.target.classList.contains('pin')) return;
                    e.preventDefault();
                    const dx = t[0].clientX - initMidX;
                    const dy = t[0].clientY - initMidY;
                    panX = initPanX + dx;
                    panY = initPanY + dy;
                    clampPan();
                    applyTransform();
                }
            }, { passive: false });

            center.addEventListener('touchend', e => {
                touches = Array.from(e.touches);
                if (touches.length === 0 && touchMoved) {
                    // 터치 이동 후 canvas click 차단
                    center._suppressClick = true;
                    setTimeout(() => { center._suppressClick = false; }, 80);
                }
            });
        })();

        function selectMap(idx) { 
            activeIdx = idx;
            zoomScale = 1; panX = 0; panY = 0;
            const img = document.getElementById('blueprint-display');
            img.onload = () => { fitBlueprint(); renderPins(); };

        // 창 크기 변경 시 재계산 (PC 리사이즈 & 태블릿 회전 대응)
        window.addEventListener('resize', () => {
            if (activeIdx !== -1) { fitBlueprint(); renderPins(); }
        });

        function renderPins() {
            const layer = document.getElementById('pin-layer'); layer.innerHTML = "";
            if(activeIdx === -1) return;
            blueprints[activeIdx].pins.forEach(p => {
                const el = document.createElement('div');
                el.className = `pin ${(p.afterPhotos && p.afterPhotos.length > 0) || p.afterNote ? 'pin-blue' : 'pin-red'}`;
                el.style.left = p.x + '%'; el.style.top = p.y + '%'; el.innerText = p.id;

                let longTimer = null;
                let isDragging = false;
                let touchStartX = 0, touchStartY = 0;

                function getImg() { return document.getElementById('blueprint-display'); }

                function toPercent(clientX, clientY) {
                    const r = getImg().getBoundingClientRect();
                    return {
                        nx: Math.min(100, Math.max(0, ((clientX - r.left) / r.width)  * 100)),
                        ny: Math.min(100, Math.max(0, ((clientY - r.top)  / r.height) * 100))
                    };
                }

                function startDrag() {
                    isDragging = true;
                    isDraggingPin = true;
                    const inv = 1 / (fitScale * zoomScale);
                    el.style.opacity    = '0.75';
                    el.style.transform  = `translate(-50%,-50%) scale(${inv * 1.35})`;
                    el.style.zIndex     = '500';
                    el.style.transition = 'transform 0.12s';
                    el.style.cursor     = 'grabbing';
                    if (navigator.vibrate) navigator.vibrate(40);
                }

                function endDrag() {
                    if(!isDragging) return;
                    isDragging = false;
                    setTimeout(() => { isDraggingPin = false; }, 100);
                    const nx = parseFloat(el.style.left);
                    const ny = parseFloat(el.style.top);
                    const pin = blueprints[activeIdx].pins.find(x => x.id === p.id);
                    if(pin) { pin.x = nx; pin.y = ny; syncDB(); }
                    const inv = 1 / (fitScale * zoomScale);
                    el.style.opacity = ''; el.style.transform = `translate(-50%,-50%) scale(${inv})`; el.style.zIndex = ''; el.style.transition = ''; el.style.cursor = '';
                    document.removeEventListener('touchmove', onTouchMoveDoc, { passive: false });
                    document.removeEventListener('touchend',  onTouchEndDoc);
                    document.removeEventListener('touchcancel', onTouchEndDoc);
                }

                // document 레벨 핸들러 — 롱프레스 후 등록
                function onTouchMoveDoc(e) {
                    if(!isDragging) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    const { nx, ny } = toPercent(t.clientX, t.clientY);
                    el.style.left = nx + '%';
                    el.style.top  = ny + '%';
                }
                function onTouchEndDoc(e) {
                    clearTimeout(longTimer);
                    endDrag();
                }

                // ── 터치 ──
                // Android/iOS 롱프레스 컨텍스트 메뉴(공유·인쇄) 완전 차단
                el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); });

                el.addEventListener('touchstart', e => {
                    e.preventDefault(); // 브라우저 롱프레스 팝업 선점 차단
                    e.stopPropagation();
                    const t = e.touches[0];
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    isDragging = false;
                    longTimer = setTimeout(() => {
                        startDrag();
                        // 롱프레스 확정 후 document에 이동/종료 핸들러 등록
                        document.addEventListener('touchmove',   onTouchMoveDoc, { passive: false });
                        document.addEventListener('touchend',    onTouchEndDoc);
                        document.addEventListener('touchcancel', onTouchEndDoc);
                    }, 500);
                }, { passive: false }); // passive:false 필수 — preventDefault() 사용 전제

                el.addEventListener('touchmove', e => {
                    if(isDragging) {
                        e.preventDefault(); // 드래그 중 페이지 스크롤 방지
                        return; // document 핸들러가 좌표 처리
                    }
                    const t = e.touches[0];
                    const dx = Math.abs(t.clientX - touchStartX);
                    const dy = Math.abs(t.clientY - touchStartY);
                    // 20px 이상 움직이면 롱프레스 취소 (스크롤 의도) — 임계값 완화
                    if(dx > 20 || dy > 20) clearTimeout(longTimer);
                }, { passive: false });

                el.addEventListener('touchend', e => {
                    clearTimeout(longTimer);
                    if(!isDragging) {
                        e.preventDefault();   // 후속 click 이벤트(→ handleCanvasClick) 차단
                        e.stopPropagation();
                        openViewModal(p.id);
                    }
                });

                el.addEventListener('touchcancel', () => { clearTimeout(longTimer); endDrag(); });

                // ── 마우스 (PC) ──
                // click 이벤트가 canvas-container의 handleCanvasClick으로 버블링되지 않도록 차단
                el.addEventListener('click', e => { e.stopPropagation(); });

                el.addEventListener('mousedown', e => {
                    e.stopPropagation();
                    isDragging = false;
                    longTimer = setTimeout(startDrag, 500);

                    // document에 올려야 핀 밖으로 마우스가 나가도 추적됨
                    function onMouseMove(ev) {
                        if(!isDragging) return;
                        const { nx, ny } = toPercent(ev.clientX, ev.clientY);
                        el.style.left = nx + '%';
                        el.style.top  = ny + '%';
                    }

                    function onMouseUp(ev) {
                        clearTimeout(longTimer);
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        if(isDragging) {
                            endDrag();
                        } else {
                            openViewModal(p.id);
                        }
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                layer.appendChild(el);
            });
            // 핀 생성 직후 현재 줌 배율로 크기 보정
            applyTransform();
        }

        /* 🟢 미리보기 전용 로직 (2단 구성) */

            document.getElementById('view-photos-after').innerHTML = p.afterPhotos.map((img,i) => `<img src="${img}" onclick="openLightbox('${img}','after',${i})">`).join('');

        function triggerUpload(target, type) {
            uploadTarget = target;
            document.getElementById(type === 'camera' ? 'input-camera' : 'input-gallery').click();
        }

        // 업로드 직후 마킹 관련 상태
        let _umQueue = [];      // 처리 대기 사진 목록
        let _umTarget = null;   // 'before' or 'after'
        let _umColor  = '#ff3b30';
        let _umSize   = 3;
        let _umDrawing = false;
        let _umHistory = [];

        async function handlePhotoUpload(e) {
            const files = Array.from(e.target.files);
            const p = blueprints[activeIdx].pins.find(x => x.id == currentPinId);
            if (!p || !files.length) return;

            // 리사이즈 후 마킹 큐에 추가
            _umQueue = [];
            _umTarget = uploadTarget;
            for (let file of files) {
                const raw = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = ev => r(ev.target.result);
                    reader.readAsDataURL(file);
                });
                const resized = await resizeImage(raw, 1280, 1280, 0.75);
                _umQueue.push(resized);
            }
            e.target.value = ''; // input 초기화
            _umProcessNext();
        }

        function _umProcessNext() {
            if (!_umQueue.length) { renderThumbs(); return; }
            const src = _umQueue[0];
            const canvas = document.getElementById('upload-mark-canvas');
            const modal  = document.getElementById('upload-mark-modal');

            // 캔버스에 사진 그리기
            const img = new Image();
            img.onload = () => {
                const maxW = window.innerWidth  * 0.95;
                const maxH = window.innerHeight * 0.72;
                const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
                canvas.width  = Math.round(img.width  * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.style.width  = canvas.width  + 'px';
                canvas.style.height = canvas.height + 'px';
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                _umHistory = [ctx.getImageData(0, 0, canvas.width, canvas.height)];
            };
            img.src = src;
            modal.classList.add('open');

            // 그리기 이벤트
            canvas.onmousedown  = _umMStart;
            canvas.onmousemove  = _umMMove;
            canvas.onmouseup    = _umMEnd;
            canvas.ontouchstart = _umTStart;
            canvas.ontouchmove  = _umTMove;
            canvas.ontouchend   = _umMEnd;
        }

        async function umSave() {
            const canvas = document.getElementById('upload-mark-canvas');
            const newSrc = canvas.toDataURL('image/jpeg', 0.92);
            const p = blueprints[activeIdx].pins.find(x => x.id == currentPinId);
            const today = getToday();
            if (_umTarget === 'before') { p.beforePhotos.push(newSrc); p.beforeDate = today; }
            else                        { p.afterPhotos.push(newSrc);  p.afterDate  = today; }
            _umQueue.shift();
            document.getElementById('upload-mark-modal').classList.remove('open');
            _umProcessNext();
        }

        function umSkip() {
            const p = blueprints[activeIdx].pins.find(x => x.id == currentPinId);
            const today = getToday();
            const src = _umQueue.shift();
            if (_umTarget === 'before') { p.beforePhotos.push(src); p.beforeDate = today; }
            else                        { p.afterPhotos.push(src);  p.afterDate  = today; }
            document.getElementById('upload-mark-modal').classList.remove('open');
            _umProcessNext();
        }

        function umCancel() {
            _umQueue = [];
            document.getElementById('upload-mark-modal').classList.remove('open');
            renderThumbs();
        }

        function umSetColor(c, el) {
            _umColor = c;
            document.querySelectorAll('.um-color-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }
        function umSetSize(s, el) {
            _umSize = s;
            document.querySelectorAll('#upload-mark-toolbar button[title="얇게"],#upload-mark-toolbar button[title="보통"],#upload-mark-toolbar button[title="굵게"]')
                .forEach(b => b.classList.remove('active-tool'));
            el.classList.add('active-tool');
        }
        function umUndo() {
            if (_umHistory.length <= 1) return;
            _umHistory.pop();
            const canvas = document.getElementById('upload-mark-canvas');
            canvas.getContext('2d').putImageData(_umHistory[_umHistory.length-1], 0, 0);
        }
        function umClear() {
            const canvas = document.getElementById('upload-mark-canvas');
            canvas.getContext('2d').putImageData(_umHistory[0], 0, 0);
            _umHistory = [_umHistory[0]];
        }
        function _umPos(e) {
            const r = document.getElementById('upload-mark-canvas').getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function _umMStart(e) {
            _umDrawing = true;
            const ctx = document.getElementById('upload-mark-canvas').getContext('2d');
            const p = _umPos(e);
            ctx.beginPath(); ctx.moveTo(p.x, p.y);
            ctx.strokeStyle = _umColor; ctx.lineWidth = _umSize;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            e.preventDefault();
        }
        function _umMMove(e) {
            if (!_umDrawing) return;
            const canvas = document.getElementById('upload-mark-canvas');
            const p = _umPos(e);
            const ctx = canvas.getContext('2d');
            ctx.lineTo(p.x, p.y); ctx.stroke();
            e.preventDefault();
        }
        function _umMEnd() {
            if (!_umDrawing) return;
            _umDrawing = false;
            const canvas = document.getElementById('upload-mark-canvas');
            _umHistory.push(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height));
        }
        function _umTStart(e) {
            if (e.touches.length !== 1) return;
            _umMStart({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: () => e.preventDefault() });
        }
        function _umTMove(e) {
            if (e.touches.length !== 1) return;
            _umMMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: () => e.preventDefault() });
        }

        // 이미지를 최대 1920px로 리사이즈하여 base64 반환 (태블릿 대용량 이미지 대응)
        function resizeImage(src, maxW, maxH, quality) {
            const q = (typeof quality === 'number') ? quality : 0.82;
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxW || h > maxH) {
                        const ratio = Math.min(maxW / w, maxH / h);
                        w = Math.round(w * ratio); h = Math.round(h * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', q));
                };
                img.src = src;
            });
        }

            if(!src || src === window.location.href || !src.startsWith('data:')) { alert('도면 이미지를 선택해주세요.'); return; }

            const saveBtn = document.querySelector('#add-blueprint-modal button[onclick="saveBlueprint()"]');
            if(saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

            try {
                const optimizedSrc = await resizeImage(src, 4096, 4096, 0.90);
                saveRecent('dong', dong);
                saveRecent('floor', floor);
                saveRecent('room', room);
                blueprints.push({ dong, floor, room, src: optimizedSrc, pins: [] });
                await syncDB();
                renderTree();
                closeAddBlueprintModal();
                selectMap(blueprints.length - 1);

                console.error('저장 실패:', err);
                alert('저장 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));

        }

        // ── JSON 불러오기 (덮어쓰기 또는 병합) ──
        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            event.target.value = '';
            const text = await file.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch(e) { alert('올바른 JSON 파일이 아닙니다.'); return; }
            if (!parsed.blueprints || !Array.isArray(parsed.blueprints)) { alert('형식이 맞지 않는 파일입니다.'); return; }

            const choice = confirm(
                `📂 불러오기 방식을 선택하세요.\n\n` +
                `[확인] → 덮어쓰기: 현재 데이터를 모두 지우고 파일 내용으로 교체\n` +
                `[취소] → 병합: 현재 데이터에 파일 내용을 추가`
            );

            if (choice) {
                blueprints = parsed.blueprints;
                if (parsed.siteName) {
                    localStorage.setItem('siteName', parsed.siteName);
                    document.getElementById('site-name-display').innerText = parsed.siteName;
                }
            } else {
                for (const incoming of parsed.blueprints) {
                    const existing = blueprints.find(b => b.dong === incoming.dong && b.floor === incoming.floor && b.room === incoming.room);
                    if (existing) {
                        for (const np of incoming.pins) {
                            const isDuplicate = existing.pins.some(ep =>
                                Math.abs(ep.x - np.x) < 0.01 &&
                                Math.abs(ep.y - np.y) < 0.01 &&
                                (ep.process   || '') === (np.process   || '') &&
                                (ep.roomName  || '') === (np.roomName  || '') &&
                                (ep.beforeNote|| '') === (np.beforeNote|| '') &&
                                (ep.afterNote || '') === (np.afterNote || '')
                            );
                            if (!isDuplicate) {
                                const maxId = existing.pins.length > 0 ? Math.max(...existing.pins.map(p=>p.id)) : 0;
                                np.id = maxId + 1;
                                existing.pins.push(np);
                            }
                        }
                    } else {
                        blueprints.push(incoming);
                    }
                }
            }

            try {
                await syncDB();
                activeIdx = -1;
                document.getElementById('canvas-container').style.display = 'none';
                document.getElementById('pin-summary-list').innerHTML = '';
                renderTree();
                alert('✅ 불러오기 완료!');
            } catch(err) {
                console.error('불러오기 저장 오류:', err);
                alert('불러오기 중 저장 오류가 발생했습니다.\n' + (err && err.message ? err.message : String(err)));
            }
        }

            const ROW_HEIGHT_PHOTO = 80;

            // ── 데이터 행 작성 ──
            const cellStyle = (cell) => {

                    right:  {style:'thin', color:{argb:'FFCCCCCC'}}
                };
            };

            // base64 → ArrayBuffer 변환
            function base64ToBuffer(base64) {
                const b64 = base64.split(',')[1] || base64;
                const binary = atob(b64);
                const buffer = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
                return buffer.buffer;
            }

            // 이미지 삽입 헬퍼 (행 높이 꽉 채우기 + 중앙 정렬)
            async function insertPhoto(base64, sheet, col, rowNum, rowHeightPt) {
                try {
                    const buffer = base64ToBuffer(base64);
                    const ext = base64.includes('image/png') ? 'png' : 'jpeg';
                    const imageId = workbook.addImage({ buffer, extension: ext });

                    // 열 너비 22 기준 픽셀 변환 (Excel: 1 character width ≈ 7px + 5px padding)
                    const COL_CHAR_WIDTH = 22;
                    const COL_WIDTH_PX = COL_CHAR_WIDTH * 7 + 5;  // ≈ 159px

                    // 행 높이 pt → px (Excel: 1pt = 1px in EMU context, 행높이는 pt 단위)
                    // ExcelJS addImage ext는 화면 픽셀 기준 (96dpi: 1pt = 1.333px)
                    const ROW_HEIGHT_PX = rowHeightPt * 1.333;

                    // 여백 4px (상하좌우)
                    const MARGIN = 4;
                    const imgW = COL_WIDTH_PX - MARGIN * 2;
                    const imgH = ROW_HEIGHT_PX - MARGIN * 2;

                    // 중앙 정렬을 위한 오프셋(px)
                    const offsetX = MARGIN;
                    const offsetY = MARGIN;

                    // ExcelJS: tl에 col/row는 0-based 정수, nativeCol/nativeRow 오프셋은 EMU(914400 = 1inch)
                    // 픽셀 → EMU: 1px = 9525 EMU (96dpi 기준)
                    const PX_TO_EMU = 9525;

                    sheet.addImage(imageId, {
                        tl: {
                            col: col - 1,
                            row: rowNum - 1,
                            nativeColOff: offsetX * PX_TO_EMU,
                            nativeRowOff: offsetY * PX_TO_EMU
                        },
                        br: {
                            col: col,
                            row: rowNum,
                            nativeColOff: -offsetX * PX_TO_EMU,
                            nativeRowOff: -offsetY * PX_TO_EMU
                        },
                        editAs: 'twoCell'
                    });
                } catch(e) { /* 이미지 삽입 실패 시 무시 */ }
            }

            let currentRow = 3;
            for (const r of rows) {
                const hasPhoto = r.beforePhotos.length > 0 || r.afterPhotos.length > 0;
                const photoCount = Math.max(r.beforePhotos.length, r.afterPhotos.length, 1);
                const rowHeight = hasPhoto ? ROW_HEIGHT_PHOTO : ROW_HEIGHT_TEXT;

                for (let pi = 0; pi < photoCount; pi++) {
                    const row = sheet.getRow(currentRow);
                    row.height = rowHeight;

                    // A: 순번 (첫 사진행에만)
                    const cellA = row.getCell(1); cellStyle(cellA);
                    cellA.value = pi === 0 ? r.seq : '';

                    // B: 동/건물명
                    const cellB = row.getCell(2); cellStyle(cellB);
                    cellB.value = pi === 0 ? r.dong : '';

                    // C: 층
                    const cellC = row.getCell(3); cellStyle(cellC);
                    cellC.value = pi === 0 ? r.floor : '';

                    // D: 공간명
                    const cellD = row.getCell(4); cellStyle(cellD);
                    cellD.value = pi === 0 ? r.room : '';

                    // E: 실명
                    const cellE = row.getCell(5); cellStyle(cellE);
                    cellE.value = pi === 0 ? r.roomDetail : '';

                    // F: 공정
                    const cellF = row.getCell(6); cellStyle(cellF);
                    cellF.value = pi === 0 ? r.process : '';

                    // G: 내용
                    const cellG = row.getCell(7); cellStyle(cellG);
                    cellG.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true };
                    cellG.value = pi === 0 ? r.content : '';

                    // H: 점검 내용(사진) — 사진 삽입
                    const cellH = row.getCell(8); cellStyle(cellH);
                    cellH.value = '';
                    if (r.beforePhotos[pi]) {
                        await insertPhoto(r.beforePhotos[pi], sheet, 8, currentRow, rowHeight);
                    }

                    // I: 점검일 — YYYY-MM-DD 서식 통일
                    const cellI = row.getCell(9); cellStyle(cellI);
                    cellI.value = pi === 0 ? normalizeDate(r.beforeDate) : '';

                    // J: 조치 결과(사진) — 사진 있으면 사진, 없으면 내용 텍스트
                    const cellJ = row.getCell(10); cellStyle(cellJ);
                    cellJ.value = '';
                    if (r.afterPhotos[pi]) {
                        // 사진 있으면 사진 삽입 (텍스트 무시)
                        await insertPhoto(r.afterPhotos[pi], sheet, 10, currentRow, rowHeight);
                    } else if (pi === 0 && !r.afterPhotos.length && r.afterNote) {
                        // 사진 없고 내용(텍스트)만 있으면 텍스트 표시
                        cellJ.value = r.afterNote;
                        cellJ.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true };
                    }

                    // K: 조치일 — YYYY-MM-DD 서식 통일
                    const cellK = row.getCell(11); cellStyle(cellK);
                    cellK.value = pi === 0 ? normalizeDate(r.afterDate) : '';

                    // L: 비고
                    const cellL = row.getCell(12); cellStyle(cellL);
                    cellL.value = pi === 0 ? r.remark : '';

                    // 짝수 행 배경
                    if (r.seq % 2 === 0) {
                        [cellA,cellB,cellC,cellD,cellE,cellF,cellG,cellH,cellI,cellJ,cellK,cellL].forEach(c => {
                            if (!c.value && !hasPhoto) {
                                c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF7F9FC'} };
                            } else {
                                c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF7F9FC'} };
                            }
                        });
                    }

                    currentRow++;
                }
            }

            // 생성 후 다운로드
            const today = new Date();
            const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveAs(blob, `${siteName}_품질검수보고서_${dateStr}.xlsx`);
            alert(`✅ 엑셀 내보내기 완료!\n총 ${rows.length}건 (${seq-1}개 핀)`);
        }
    </script>

    <div id="tree-context-menu">
        <div class="menu-title" id="ctx-menu-title">항목 관리</div>
        <button id="ctx-btn-rename" onmousedown="ctx_renameItem(event)" ontouchend="ctx_renameItem(event)">✏️ 이름 변경</button>

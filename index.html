    <script>
        // ── 트리 롱클릭 컨텍스트 메뉴 ──
        let ctxTarget = null;
        let ctxMenuOpen = false;

        function closeCtxMenu() {
            if (!ctxMenuOpen) return;
            document.getElementById('tree-context-menu').style.display = 'none';
            ctxMenuOpen = false;
        }

        // mousedown이 아닌 pointerdown 기준으로 외부 클릭 감지 — prompt/confirm 이후 blur 간섭 없음
        document.addEventListener('pointerdown', (e) => {
            if (ctxMenuOpen && !document.getElementById('tree-context-menu').contains(e.target)) {
                closeCtxMenu();
            }
        });

        function showCtxMenu(x, y, target) {
            ctxTarget = target;
            const menu = document.getElementById('tree-context-menu');
            const label = target.type === 'dong' ? `📁 ${target.dong}`
                        : target.type === 'floor' ? `📂 ${target.floor}`
                        : `📄 ${target.label}`;
            document.getElementById('ctx-menu-title').textContent = label;

            menu.style.display = 'block';
            // 화면 밖으로 나가지 않도록 조정
            requestAnimationFrame(() => {
                const mw = menu.offsetWidth, mh = menu.offsetHeight;
                menu.style.left = Math.min(x, window.innerWidth  - mw - 8) + 'px';
                menu.style.top  = Math.min(y, window.innerHeight - mh - 8) + 'px';
            });
            ctxMenuOpen = true;
        }

        // 롱프레스 부착 — mousedown/touchstart에서 타이머 시작, 600ms 후 메뉴 표시
        function attachLongPress(el, targetFn) {
            let timer = null;
            let didLong = false; // 롱프레스 발동 여부

            function start(x, y) {
                didLong = false;
                timer = setTimeout(() => {
                    didLong = true;
                    showCtxMenu(x, y, targetFn());
                }, 600);
            }
            function cancel() { clearTimeout(timer); }

            // 마우스
            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                start(e.clientX, e.clientY);
            });
            el.addEventListener('mousemove', cancel);
            el.addEventListener('mouseup',   cancel);
            el.addEventListener('mouseleave',cancel);
            // 롱프레스가 발동된 경우 뒤따르는 click이 toggleTree를 호출하지 않도록 차단
            el.addEventListener('click', (e) => { if (didLong) { e.stopImmediatePropagation(); didLong = false; } });

            // 터치
            el.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                start(t.clientX, t.clientY);
            }, { passive: true });
            el.addEventListener('touchmove',   cancel, { passive: true });
            el.addEventListener('touchend',    cancel);
            el.addEventListener('touchcancel', cancel);

            // PC 우클릭
            el.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtxMenu(e.clientX, e.clientY, targetFn()); });
        }

        // ── 메뉴 버튼 액션 (onmousedown/ontouchend 사용 — click보다 먼저 실행됨) ──
        function ctx_renameItem(e) {
            e.preventDefault(); e.stopPropagation();
            const t = Object.assign({}, ctxTarget);  // 로컬 복사 후 메뉴 닫기
            closeCtxMenu();
            // setTimeout으로 DOM 정리 후 prompt 실행 (버블링 완전 종료 후)
            setTimeout(() => {
                let val;
                if (t.type === 'dong') {
                    val = prompt('동/건물명 변경:', t.dong);
                    if (!val || !val.trim()) return;
                    blueprints.forEach(bp => { if (bp.dong === t.dong) bp.dong = val.trim(); });
                } else if (t.type === 'floor') {
                    val = prompt('층 이름 변경:', t.floor);
                    if (!val || !val.trim()) return;
                    blueprints.forEach(bp => { if (bp.dong === t.dong && bp.floor === t.floor) bp.floor = val.trim(); });
                } else {
                    val = prompt('공간명 변경:', t.label);
                    if (!val || !val.trim()) return;
                    blueprints[t.roomIndex].room = val.trim();
                }
                syncDB(); renderTree();
            }, 50);
        }

        async function ctx_deleteItem(e) {
            e.preventDefault(); e.stopPropagation();
            const t = Object.assign({}, ctxTarget);
            closeCtxMenu();
            setTimeout(async () => {
                if (t.type === 'dong') {
                    if (!confirm(`'${t.dong}' 동 전체와 하위 도면/핀을 모두 삭제할까요?`)) return;
                    blueprints = blueprints.filter(bp => bp.dong !== t.dong);
                    if (activeIdx !== -1 && !blueprints[activeIdx]) resetActive();
                } else if (t.type === 'floor') {
                    if (!confirm(`'${t.dong} ${t.floor}' 층 전체와 하위 도면/핀을 모두 삭제할까요?`)) return;
                    const removedIdxs = blueprints.map((bp,i) => (bp.dong===t.dong && bp.floor===t.floor) ? i : -1).filter(i=>i>=0);
                    blueprints = blueprints.filter(bp => !(bp.dong===t.dong && bp.floor===t.floor));
                    if (removedIdxs.includes(activeIdx)) { resetActive(); }
                    else { let shift = removedIdxs.filter(i=>i<activeIdx).length; activeIdx -= shift; }
                } else {
                    if (!confirm(`'${t.label}' 도면과 핀 데이터를 삭제할까요?`)) return;
                    blueprints.splice(t.roomIndex, 1);
                    if (activeIdx === t.roomIndex) resetActive();
                    else if (activeIdx > t.roomIndex) activeIdx--;
                }
                await syncDB(); renderTree();
            }, 50);
        }

        function resetActive() {
            activeIdx = -1;
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('pin-summary-list').innerHTML = '';
        }
    </script>

    <!-- 사진 라이트박스 JS -->
    <script>
      let _lbScale = 1, _lbTx = 0, _lbTy = 0;
      const LB_MAX = 8, LB_MIN = 1;
      let _lbBadgeTimer = null;

      let _lbPhotoType = null;
      let _lbPhotoIdx  = null;

      function openLightbox(src, type, idx) {
          const lb = document.getElementById('lightbox');
          const img = document.getElementById('lightbox-img');
          img.src = src;
          _lbScale = 1; _lbTx = 0; _lbTy = 0;
          _lbPhotoType = type || null;
          _lbPhotoIdx  = (idx !== undefined) ? idx : null;
          _lbApply();
          lb.classList.add('open');
          document.body.style.overflow = 'hidden';
          cancelMarking();
      }
      function closeLightbox() {
          document.getElementById('lightbox').classList.remove('open');
          document.getElementById('lightbox-img').src = '';
          document.body.style.overflow = '';
      }
      function lbClose(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); }

      function _lbApply() {
          const img = document.getElementById('lightbox-img');
          img.style.transform = `translate(${_lbTx}px, ${_lbTy}px) scale(${_lbScale})`;
      }
      function _lbClamp() {
          // scale=1이면 중앙 고정
          if (_lbScale <= 1) { _lbTx = 0; _lbTy = 0; return; }
          const img = document.getElementById('lightbox-img');
          const iw = img.offsetWidth * _lbScale, ih = img.offsetHeight * _lbScale;
          const vw = window.innerWidth, vh = window.innerHeight;
          const maxX = Math.max(0, (iw - vw) / 2);
          const maxY = Math.max(0, (ih - vh) / 2);
          _lbTx = Math.min(maxX, Math.max(-maxX, _lbTx));
          _lbTy = Math.min(maxY, Math.max(-maxY, _lbTy));
      }
      function _lbShowBadge() {
          const b = document.getElementById('lightbox-scale-badge');
          b.textContent = Math.round(_lbScale * 100) + '%';
          b.style.display = 'block';
          clearTimeout(_lbBadgeTimer);
          _lbBadgeTimer = setTimeout(() => b.style.display = 'none', 1400);
      }
      function lbZoomStep(factor, cx, cy) {
          const vw = window.innerWidth, vh = window.innerHeight;
          const px = cx !== undefined ? cx : vw / 2;
          const py = cy !== undefined ? cy : vh / 2;
          const newScale = Math.min(LB_MAX, Math.max(LB_MIN, _lbScale * factor));
          const ratio = newScale / _lbScale;
          _lbTx = px - ratio * (px - _lbTx); // 사실상 translate 보정
          _lbTy = py - ratio * (py - _lbTy);
          _lbScale = newScale;
          _lbClamp(); _lbApply(); _lbShowBadge();
      }
      function lbReset() { _lbScale = 1; _lbTx = 0; _lbTy = 0; _lbApply(); _lbShowBadge(); }

      // 마우스 휠
      document.getElementById('lightbox').addEventListener('wheel', e => {
          if (!document.getElementById('lightbox').classList.contains('open')) return;
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
          lbZoomStep(factor, e.clientX, e.clientY);
      }, { passive: false });

      // 마우스 드래그 패닝
      (function() {
          const lb = document.getElementById('lightbox');
          let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
          lb.addEventListener('mousedown', e => {
              if (e.target.tagName === 'BUTTON') return;
              drag = true; sx = e.clientX; sy = e.clientY; ox = _lbTx; oy = _lbTy;
              document.getElementById('lightbox-img').classList.add('panning');
              e.preventDefault();
          });
          document.addEventListener('mousemove', e => {
              if (!drag) return;
              _lbTx = ox + e.clientX - sx; _lbTy = oy + e.clientY - sy;
              _lbClamp(); _lbApply();
          });
          document.addEventListener('mouseup', () => {
              drag = false;
              document.getElementById('lightbox-img').classList.remove('panning');
          });
      })();

      // 터치 핀치줌 + 패닝
      (function() {
          const lb = document.getElementById('lightbox');
          let ts = [], initDist = 0, initScale = 1, initTx = 0, initTy = 0, initMx = 0, initMy = 0;
          function dist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
          function mid(a,b){ return {x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2}; }

          lb.addEventListener('touchstart', e => {
              ts = Array.from(e.touches);
              if (ts.length === 2) {
                  initDist = dist(ts[0],ts[1]); initScale = _lbScale;
                  initTx = _lbTx; initTy = _lbTy;
                  const m = mid(ts[0],ts[1]); initMx = m.x; initMy = m.y;
              } else if (ts.length === 1) {
                  initTx = _lbTx; initTy = _lbTy;
                  initMx = ts[0].clientX; initMy = ts[0].clientY;
              }
              e.stopPropagation();
          }, { passive: true });

          lb.addEventListener('touchmove', e => {
              const t = Array.from(e.touches);
              if (t.length === 2) {
                  e.preventDefault();
                  const curDist = dist(t[0],t[1]);
                  const factor = curDist / initDist;
                  const newScale = Math.min(LB_MAX, Math.max(LB_MIN, initScale * factor));
                  const ratio = newScale / initScale;
                  const m = mid(t[0],t[1]);
                  _lbScale = newScale;
                  _lbTx = m.x - ratio * (initMx - initTx);
                  _lbTy = m.y - ratio * (initMy - initTy);
                  _lbClamp(); _lbApply(); _lbShowBadge();
              } else if (t.length === 1 && _lbScale > 1) {
                  e.preventDefault();
                  _lbTx = initTx + t[0].clientX - initMx;
                  _lbTy = initTy + t[0].clientY - initMy;
                  _lbClamp(); _lbApply();
              }
          }, { passive: false });
      })();
    </script>

    <!-- 전체 핀치줌 차단: content-center와 미리보기 모달 내부만 허용 -->
    <script>
      function _isInsideAllowed(target) {
        let el = target;
        while (el) {
          if (el.id === 'content-center' || el.id === 'report-modal' || el.id === 'lightbox') return true;
          el = el.parentElement;
        }
        return false;
      }
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length >= 2 && !_isInsideAllowed(e.target)) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart',  function(e) { if (!_isInsideAllowed(e.target)) e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { if (!_isInsideAllowed(e.target)) e.preventDefault(); }, { passive: false });
    </script>

    <!-- PWA 설치 + SW -->
    <script>
      let _pwaPrompt = null;

      // 이미 설치된 상태(standalone)면 오버레이 절대 표시 안 함
      const _isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        _pwaPrompt = e;
        if (!_isStandalone) {
          document.getElementById('pwa-install-overlay').classList.add('show');
        }
      });

      window.addEventListener('appinstalled', () => {
        document.getElementById('pwa-install-overlay').classList.remove('show');
        _pwaPrompt = null;
      });

      function pwaBtnInstall() {
        if (!_pwaPrompt) return;
        _pwaPrompt.prompt();
        _pwaPrompt.userChoice.then(r => {
          document.getElementById('pwa-install-overlay').classList.remove('show');
          _pwaPrompt = null;
        });
      }

      function pwaDismiss() {
        document.getElementById('pwa-install-overlay').classList.remove('show');
      }

      // Service Worker 등록 + 새 버전 감지 시 자동 새로고침
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/quality-inspection/sw.js')
            .then(reg => {
              console.log('SW:', reg.scope);
              // 새 SW 대기 중이면 즉시 활성화 요청
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    console.log('SW 업데이트 완료 — 새로고침');
                    window.location.reload();
                  }
                });
              });
            })
            .catch(e => console.warn('SW 실패:', e));

          // SW에서 SW_UPDATED 메시지 수신 시 새로고침
          navigator.serviceWorker.addEventListener('message', e => {
            if (e.data && e.data.type === 'SW_UPDATED') {
              console.log('새 버전 감지 — 자동 새로고침');
              window.location.reload();
            }
          });
        });
      }
    </script>
    <!-- ✏️ 사진 마킹(그리기) JS -->
    <script>
      let _markColor = '#ff3b30', _markSize = 3;
      let _markMode = false, _markDrawing = false;
      let _markHistory = [];

      function setMarkColor(color, el) {
          _markColor = color;
          document.querySelectorAll('.mark-color-btn').forEach(b => b.classList.remove('selected'));
          el.classList.add('selected');
      }
      function setMarkSize(size, el) {
          _markSize = size;
          document.querySelectorAll('#marking-toolbar button[title="얇게"], #marking-toolbar button[title="보통"], #marking-toolbar button[title="굵게"]')
              .forEach(b => b.classList.remove('active-tool'));
          el.classList.add('active-tool');
      }

      function startMarking() {
          const img     = document.getElementById('lightbox-img');
          const canvas  = document.getElementById('mark-canvas');
          const toolbar = document.getElementById('marking-toolbar');

          img.onload = null;
          const rect = img.getBoundingClientRect();
          canvas.width  = rect.width;
          canvas.height = rect.height;
          canvas.style.left   = rect.left + 'px';
          canvas.style.top    = rect.top  + 'px';
          canvas.style.width  = rect.width  + 'px';
          canvas.style.height = rect.height + 'px';

          // 현재 사진을 캔버스에 그리기
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, rect.width, rect.height);
          _markHistory = [ctx.getImageData(0, 0, canvas.width, canvas.height)];

          canvas.classList.add('show');
          toolbar.classList.add('show');
          document.getElementById('lightbox-zoom-btns').style.display = 'none';
          document.getElementById('lightbox-close').style.display = 'none';
          _markMode = true;

          canvas.addEventListener('mousedown',  _mStart);
          canvas.addEventListener('mousemove',  _mMove);
          canvas.addEventListener('mouseup',    _mEnd);
          canvas.addEventListener('touchstart', _tStart, { passive: false });
          canvas.addEventListener('touchmove',  _tMove,  { passive: false });
          canvas.addEventListener('touchend',   _mEnd);
      }

      function cancelMarking() {
          const canvas  = document.getElementById('mark-canvas');
          const toolbar = document.getElementById('marking-toolbar');
          if (!canvas) return;
          canvas.classList.remove('show');
          toolbar && toolbar.classList.remove('show');
          document.getElementById('lightbox-zoom-btns').style.display = '';
          document.getElementById('lightbox-close').style.display = '';
          _markMode = false; _markHistory = [];
          canvas.removeEventListener('mousedown',  _mStart);
          canvas.removeEventListener('mousemove',  _mMove);
          canvas.removeEventListener('mouseup',    _mEnd);
          canvas.removeEventListener('touchstart', _tStart);
          canvas.removeEventListener('touchmove',  _tMove);
          canvas.removeEventListener('touchend',   _mEnd);
      }

      async function saveMarking() {
          const canvas = document.getElementById('mark-canvas');
          const newSrc = canvas.toDataURL('image/jpeg', 0.92);
          if (activeIdx !== -1 && currentPinId !== null && _lbPhotoType && _lbPhotoIdx !== null) {
              const pin = blueprints[activeIdx].pins.find(p => p.id === currentPinId);
              if (pin) {
                  if (_lbPhotoType === 'before') pin.beforePhotos[_lbPhotoIdx] = newSrc;
                  else                           pin.afterPhotos[_lbPhotoIdx]  = newSrc;
                  await syncDB();
                  openViewModal(currentPinId);
              }
          }
          cancelMarking();
          closeLightbox();
      }

      function markUndo() {
          if (_markHistory.length <= 1) return;
          _markHistory.pop();
          const canvas = document.getElementById('mark-canvas');
          canvas.getContext('2d').putImageData(_markHistory[_markHistory.length - 1], 0, 0);
      }
      function markClear() {
          const canvas = document.getElementById('mark-canvas');
          canvas.getContext('2d').putImageData(_markHistory[0], 0, 0);
          _markHistory = [_markHistory[0]];
      }

      function _pos(e, canvas) {
          const r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      function _mStart(e) {
          _markDrawing = true;
          const canvas = document.getElementById('mark-canvas');
          const ctx = canvas.getContext('2d');
          const p = _pos(e, canvas);
          ctx.beginPath(); ctx.moveTo(p.x, p.y);
          ctx.strokeStyle = _markColor; ctx.lineWidth = _markSize;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          e.preventDefault();
      }
      function _mMove(e) {
          if (!_markDrawing) return;
          const canvas = document.getElementById('mark-canvas');
          const p = _pos(e, canvas);
          const ctx = canvas.getContext('2d');
          ctx.lineTo(p.x, p.y); ctx.stroke();
          e.preventDefault();
      }
      function _mEnd() {
          if (!_markDrawing) return;
          _markDrawing = false;
          const canvas = document.getElementById('mark-canvas');
          _markHistory.push(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height));
      }
      function _tStart(e) {
          if (e.touches.length !== 1) return;
          _mStart({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: () => e.preventDefault() });
      }
      function _tMove(e) {
          if (e.touches.length !== 1) return;
          _mMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: () => e.preventDefault() });
      }
    </script>
